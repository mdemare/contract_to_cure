name: contract_to_cure_staging
services:
  webapp:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - UID=1000
        - GID=1000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "1${EXPOSED_PORT:-3100}:2583"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "2583"
    restart: unless-stopped
    command: ["./main"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:2583/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
