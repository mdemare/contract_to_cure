name: Test

on:
  push:
    branches: [ '*' ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27.2'

    - name: Run tests
      run: make check
