name: Test

on:
  push:
    branches: [ '*' ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Set up Node.js
      uses: actions/setup-node@v7.1.0
      with:
        node-version: '26.13.0'

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27.3'

    - name: Run tests
      run: make check
